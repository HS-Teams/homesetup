[firebase]
hhs.firebase.config.file = ${HHS_DIR}/firebase.properties
hhs.firebase.database =
hhs.firebase.passphrase =
hhs.firebase.project.id =
hhs.firebase.user.uid =
hhs.firebase.username =

[setman]
hhs.setman.database = ${HHS_SETMAN_DB_FILE}
hhs.setman.encode.database =
hhs.setman.config.file = ${HHS_DIR}/setman.properties
hhs.setman.db.file = ${HHS_DIR}/setman.db
hhs.settings.database = resources/sqlite.db
hhs.settings.encode.database = False

[vault]
hhs.vault.file = ${HHS_DIR}/.vault
hhs.vault.passphrase =
hhs.vault.user = ${USER}

[clitt]
hhs.clitt.checked.icon = MARKED
hhs.clitt.items.per.line = 6
hhs.clitt.max.rows = 10
hhs.clitt.selected.icon = POINTER
hhs.clitt.success.color = GREEN
hhs.clitt.text.color = WHITE
hhs.clitt.title.color = ORANGE

[ollama]
hhs.ollama.history.file = ${HHS_DIR}/.ollama_history
hhs.ollama.md.viewer = __hhs_md_viewer
hhs.ollama.model = phi4-mini:latest

[environment]
hhs.firebase.creds.file = ${HHS_DIR}/{project_id}-firebase-credentials.json
hhs.aliases.file = ${HHS_DIR}/.aliases
hhs.cache.dir = ${HHS_DIR}/cache
hhs.cmd.file = ${HHS_DIR}/.cmd_file
hhs.dirs.file = ${HHS_DIR}/.dirs
hhs.env.file = ${HHS_DIR}/.env
hhs.paths.file = ${HHS_DIR}/.path
hhs.punch.file = ${HHS_DIR}/.punches
hhs.saved.dirs.file = ${HHS_DIR}/.saved_dirs
hhs.starship.presets.dir = ${HHS_HOME}/bin/apps/bash/hhs-app/plugins/starship/hhs-presets
hhs.venv.path = ${HHS_DIR}/venv

[starship]
starship.cache = ${HHS_CACHE_DIR}
starship.config = ${HHS_DIR}/.starship.toml

[streamlit.ui]
streamlit.browser.gather.usage.stats = false

[os.properties]
bash.silence.deprecation.warning = 1
